server:
  port: 8083
  name: "event-service"
spring:
  #
  output:
    ansi:
      enabled: ALWAYS
  #
  application:
    name: event-service
  #
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/eventdb
    username: postgres
    password: daroch
  #
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  #
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.local:8080/realms/event-service
  #
  data:
    redis:
      host: redis
      port: 6379
      timeout: 1s
  cache:
    type: redis
